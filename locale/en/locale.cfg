[mod-name]
zero-cost-infinite-resources=Zero-Cost Infinite Resources

[mod-description]
zero-cost-infinite-resources=Ultra-lightweight infinite ores and fluids for Factorio 2.1 using native C++ engine mechanics. Near-zero performance impact (0 UPS overhead).

[mod-setting-name]
zcir-infinite-solid-ores=Infinite solid ores
zcir-infinite-fluids=Infinite fluids
zcir-prevent-depletion=Prevent depletion
zcir-minimum-yield=Minimum yield (%)
zcir-solid-ore-normal=Solid ore richness normal
zcir-fluid-normal=Fluid richness normal
zcir-resource-blacklist=Resource blacklist

[mod-setting-description]
zcir-infinite-solid-ores=Make solid ores (iron, copper, coal, stone, uranium, etc.) infinite nodes that never deplete.
zcir-infinite-fluids=Make fluids (crude oil and modded fluids) infinite nodes that never run dry.
zcir-prevent-depletion=When enabled, infinite resource patches maintain their yield and never degrade over time (infinite depletion amount is set to 0).
zcir-minimum-yield=The minimum yield floor percentage relative to standard resource patches (1-100%, default 100%).
zcir-solid-ore-normal=Baseline richness amount for infinite solid ores (default 1,000). Dictates 100% mining yield.
zcir-fluid-normal=Baseline richness amount for infinite fluids (default 300,000). Dictates 100% pumping yield.
zcir-resource-blacklist=Comma, semicolon, quote, or space-separated list of resource prototype names to exclude from becoming infinite (e.g., 'uranium-ore').

[command-help]
refill-infinite-resources=Refills infinite resource patches to baseline yield. Usage: /refill-infinite-resources [<radius 1-1000> | surface | <surface_name> | all] (default: 100 tiles). (Admin only)

[command-message]
refill-success=Successfully refilled __1__ infinite resource entities (scope: __2__).
