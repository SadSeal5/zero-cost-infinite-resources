[mod-name]
zero-cost-infinite-resources=Sıfır Maliyetli Sonsuz Kaynaklar

[mod-description]
zero-cost-infinite-resources=Factorio 2.1 için yerel C++ oyun motoru mekaniklerini kullanan ultra hafif sonsuz madenler ve sıvılar. Sıfır performans kaybı (0 UPS yükü).

[mod-setting-name]
zcir-infinite-solid-ores=Sonsuz katı madenler
zcir-infinite-fluids=Sonsuz sıvılar
zcir-prevent-depletion=Tükenmeyi engelle
zcir-minimum-yield=Minimum verim (%)
zcir-solid-ore-normal=Katı maden zenginlik tabanı
zcir-fluid-normal=Sıvı zenginlik tabanı
zcir-resource-blacklist=Kaynak kara listesi

[mod-setting-description]
zcir-infinite-solid-ores=Katı madenleri (demir, bakır, kömür, taş, uranyum vb.) hiçbir zaman tükenmeyen sonsuz kaynak noktalarına dönüştürür.
zcir-infinite-fluids=Sıvıları (ham petrol ve modlu sıvılar) hiçbir zaman kurumayan sonsuz kaynak noktalarına dönüştürür.
zcir-prevent-depletion=Etkinleştirildiğinde, sonsuz kaynak noktaları verimlerini korur ve zamanla azalmaz (tükenme miktarı 0 olarak ayarlanır).
zcir-minimum-yield=Standart kaynak noktalarına kıyasla minimum verim taban yüzdesi (%1 - %100 arası, varsayılan %100).
zcir-solid-ore-normal=Sonsuz katı madenler için taban zenginlik miktarı (varsayılan 1.000). %100 madencilik verimini belirler.
zcir-fluid-normal=Sonsuz sıvılar için taban zenginlik miktarı (varsayılan 300.000). %100 pompalama verimini belirler.
zcir-resource-blacklist=Sonsuz yapılması istenmeyen kaynak prototip isimlerinin virgül, noktalı virgül, tırnak veya boşlukla ayrılmış listesi (örn: 'uranium-ore').

[command-help]
refill-infinite-resources=Sonsuz kaynak noktalarını taban verime doldurur. Kullanım: /refill-infinite-resources [<yarıçap 1-1000> | surface | <yüzey_adı> | all] (varsayılan: oyuncu etrafında 100 karo; konsol/sunucu açık parametre gerektirir). (Yalnızca yöneticiler)

[command-message]
refill-success=Toplam __1__ sonsuz kaynak varlığı başarıyla yenilendi (kapsam: __2__).
